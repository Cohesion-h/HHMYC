<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Outfit:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 264px; overflow: hidden; background: #050506; }
    .stage { position: relative; width: 1200px; height: 264px; }
    .stage img.bg {
      position: absolute; inset: 0; width: 1200px; height: 264px;
      object-fit: cover; object-position: center 55%;
    }
    .veil {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, rgba(5,5,6,0.72) 0%, rgba(5,5,6,0.28) 42%, rgba(5,5,6,0.0) 62%);
    }
    .lockup {
      position: absolute;
      left: 48px;
      top: 42px;
      width: 520px;
      color: #eceae4;
    }
    .row { display: flex; align-items: center; gap: 14px; }
    .mark { width: 42px; height: 42px; color: #c5c0b5; flex-shrink: 0; }
    h1 {
      font-family: Cinzel, serif;
      font-weight: 500;
      font-size: 54px;
      letter-spacing: 0.16em;
      line-height: 1;
      color: #eceae4;
    }
    .sub {
      margin-top: 10px;
      margin-left: 56px;
      font-family: Outfit, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #c5c0b5;
    }
    .rule {
      width: 56px; height: 1px; margin: 12px 0 0 56px;
      background: rgba(197,192,181,0.5);
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="./banner-scene.jpg" alt="" />
    <div class="veil"></div>
    <div class="lockup">
      <div class="row">
        <svg class="mark" viewBox="0 0 200 200" fill="none">
          <g transform="translate(100 100)" stroke="currentColor" stroke-linejoin="round">
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(0)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(36)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(72)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(108)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(144)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(180)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(216)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(252)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(288)" stroke-width="1.5"/>
            <path d="M 0 -41 C 7 -50 24 -68 22.5 -83 C 20.5 -92 9 -95.5 0 -95.5 C -9 -95.5 -20.5 -92 -22.5 -83 C -24 -68 -7 -50 0 -41 Z" transform="rotate(324)" stroke-width="1.5"/>
          </g>
        </svg>
        <h1>HHMYC</h1>
      </div>
      <p class="sub">Design Catalogue</p>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
