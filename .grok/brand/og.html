<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Cinzel;
      src: url("/fonts/Cinzel-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: Cinzel;
      src: url("/fonts/Cinzel-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("/fonts/CormorantGaramond-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #050506;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        url("/brand/bg.jpg") center 58% / cover no-repeat;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 48%, rgba(5,5,6,0.28) 0%, rgba(5,5,6,0.52) 58%, rgba(5,5,6,0.78) 100%),
        linear-gradient(180deg, rgba(5,5,6,0.42) 0%, rgba(5,5,6,0.28) 30%, rgba(5,5,6,0.50) 52%, rgba(5,5,6,0.78) 100%);
    }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      transform: translateY(-6px);
    }
    .mark {
      width: 78px;
      height: 78px;
      display: block;
      filter: drop-shadow(0 4px 18px rgba(5,5,6,0.7));
    }
    .title {
      font-family: Cinzel, serif;
      font-weight: 400;
      font-size: 96px;
      letter-spacing: 0.38em;
      color: #eceae4;
      line-height: 1;
      margin-top: 18px;
      padding-left: 0.38em;
      text-shadow: 0 2px 28px rgba(5,5,6,0.9), 0 0 48px rgba(5,5,6,0.55);
    }
    .subtitle {
      font-family: Cinzel, serif;
      font-weight: 400;
      font-size: 14px;
      letter-spacing: 0.48em;
      color: #c9b896;
      margin-top: 16px;
      padding-left: 0.48em;
      text-shadow: 0 2px 16px rgba(5,5,6,0.85);
    }
    .rule {
      width: 88px;
      height: 1px;
      background: #c9b896;
      opacity: 0.75;
      margin: 16px 0 14px;
    }
    .tagline {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.04em;
      color: #eceae4;
      text-shadow: 0 2px 16px rgba(5,5,6,0.85);
    }
    .rev {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 30px;
      z-index: 1;
      text-align: center;
      font-family: Cinzel, serif;
      font-size: 11px;
      letter-spacing: 0.36em;
      color: #c9b896;
      padding-left: 0.36em;
      opacity: 0.82;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="scrim"></div>
    <div class="lockup">
      <img class="mark" src="/brand/ring-mark.svg" alt="" />
      <div class="title">HHMYC</div>
      <div class="subtitle">DESIGN BASIS REGISTER</div>
      <div class="rule"></div>
      <div class="tagline">A Pledge and a Promise… for the Future of Kuwait.</div>
    </div>
    <div class="rev">REV 1.0  ·  SEPTEMBER 2026</div>
  </div>
</body>
</html>
